image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/tecton.png
name: Tecton
description: >-
  Tecton is the enterprise feature platform (feature store) for real-time machine learning
  and AI at scale. It transforms raw batch, streaming, and real-time data into ML-ready
  features and embeddings, orchestrates the pipelines that materialize them, and serves them
  to models online with low latency and ~100ms freshness while guaranteeing training/serving
  consistency. Developers define features as code with the Python SDK and `tecton` CLI, then
  read them for inference through the FeatureService HTTP API and open-source Python and Java
  client libraries. Backed by Andreessen Horowitz, Lux Capital, and SV Angel.

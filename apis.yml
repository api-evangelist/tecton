apis:
- name: Tecton FeatureService HTTP API
  description: >-
    Low-latency online feature serving for model inference — read single or batched feature
    vectors, wildcard queries, and feature-service metadata. Authenticated with an
    Authorization Tecton-key header bound to a Service Account. Served from customer-specific
    cluster domains (https://<customer-cluster>.tecton.ai/api/v1/...).
